name: BANTER Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install app dependencies
        run: npm install
      - name: Build local BANTER web assets
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_APP_BUILD: ${{ github.run_number }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 sharp @capacitor/assets
      - name: Create native Android project
        run: |
          if [ -f dist/index.html ]; then
            WEB_DIR=dist
          elif [ -f dist/client/index.html ]; then
            WEB_DIR=dist/client
          elif [ -f dist/client/_shell.html ]; then
            WEB_DIR=dist/client
            cp "$WEB_DIR/_shell.html" "$WEB_DIR/index.html"
          else
            echo "BANTER web build is missing its SPA shell."
            find dist -maxdepth 3 -type f | head -80
            exit 1
          fi
          npx cap init BANTER com.arjun2526.banter --web-dir="$WEB_DIR"
          npx cap add android
          mkdir -p resources
          node -e "require('sharp')('public/banter-icon.svg').resize(512,512).png().toFile('resources/icon.png')"
          npx @capacitor/assets generate --android
          npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BANTER.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BANTER-Android-debug
          path: BANTER.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest BANTER release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: BANTER v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: BANTER.apk
          make_latest: true
