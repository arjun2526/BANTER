name: BANTER Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install app dependencies
        run: npm install
      - name: Build local BANTER web assets
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Create native Android project
        run: |
          if [ -f dist/index.html ]; then
            WEB_DIR=dist
          elif [ -f dist/client/index.html ]; then
            WEB_DIR=dist/client
          elif [ -f dist/client/_shell.html ]; then
            WEB_DIR=dist/client
            cp "$WEB_DIR/_shell.html" "$WEB_DIR/index.html"
          else
            echo "BANTER web build is missing its SPA shell."
            find dist -maxdepth 3 -type f | head -80
            exit 1
          fi
          npx cap init BANTER com.arjun2526.banter --web-dir="$WEB_DIR"
          npx cap add android
          mkdir -p resources
          npm install --no-save sharp @capacitor/assets
          node -e "require('sharp')('public/banter-icon.svg').resize(512,512).png().toFile('resources/icon.png')"
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BANTER-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
