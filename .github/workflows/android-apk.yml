name: BANTER Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Create Capacitor Android wrapper for current BANTER preview
        run: |
          mkdir -p /tmp/banter-apk/www
          cat > /tmp/banter-apk/www/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BANTER</title></head><body><p>Opening BANTER…</p></body></html>
          HTML
          cd /tmp/banter-apk
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init BANTER com.arjun2526.banter --web-dir=www
          node -e "const fs=require('fs');const p='capacitor.config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.server={url:'https://arjun2526.github.io/BANTER/',cleartext:false};fs.writeFileSync(p,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        working-directory: /tmp/banter-apk/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BANTER-Android-preview-debug
          path: /tmp/banter-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
